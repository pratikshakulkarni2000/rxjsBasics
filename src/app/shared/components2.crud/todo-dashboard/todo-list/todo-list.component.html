<ul class="list-group">
    <li *ngFor="let todo of data"
     class="list-group-item d-flex justify-content-between align-items-center">
        <strong>
            {{todo.todoItem}}
        </strong>
        <div>
            <button (click)="onTodoEdit(todo)" mat-raised-button color="primary" class="mr-2">Edit</button>
            <button (click)="onRemove(todo.todoId)" mat-raised-button color="warn">Delete</button>
        </div>
    </li>
</ul>
