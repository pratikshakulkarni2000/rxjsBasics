<h2 class="text-primary m-3">
    {{isInEditMode ? "Update Todo" : "Add Todo"}}
</h2>

<div class="card">
    <div class="card-body">
        <form #todoForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="todoItem">Todo Item</label>
                <input 
                ngModel
                #todoItem="ngModel"
                name="todoItem"
                required
                type="text" class="form-control">

                <strong class="text-danger" *ngIf="todoItem.touched && todoItem.hasError('required')">
                    Required field!!!
                </strong>
            </div>

            <button *ngIf="!isInEditMode" [disabled]="todoForm.invalid" mat-raised-button color="accent" class="w-100">Add Todo</button>
            <button (click)="onUpdate()" type="button" *ngIf="isInEditMode" mat-raised-button color="primary" class="w-100">Update Todo</button>
        </form>
    </div>
</div>
